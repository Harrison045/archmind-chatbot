services:
  - type: web
    name: archmind-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --serve
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
